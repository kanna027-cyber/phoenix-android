name: Build Phoenix APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: "stable"
          cache: true
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Flet
        run: |
          pip install flet==1.1.2 yt-dlp flet_webview flet-cli==1.1.2
      - name: Build APK arm64 only
        run: |
          echo "y" | flet build apk --arch arm64-v8a --split-per-abi --verbose
        env:
          CI: "true"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-v5.0.3-APK
          path: build/apk/*.apk
