name: Build Phoenix APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3

      - name: Check files
        run: |
          ls -la
          ls -la *.py || true
          cat requirements.txt || echo "no requirements.txt"

      - name: Build APK arm64 only
        run: |
          if [ -f "main.py" ]; then
            flet build apk --verbose
          elif [ -f "phoenix_android_v503.py" ]; then
            cp phoenix_android_v503.py main.py
            flet build apk --verbose
          else
            echo "ERROR: No main.py found!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-v5.0.3-Android-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
